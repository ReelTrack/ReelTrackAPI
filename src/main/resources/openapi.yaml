      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContentRequest' }
            example:
              type: MOVIE
              title: "Inception"
              releaseDate: "2010-07-16"
              posterUrl: "https://example.com/inception_poster.jpg"
              bannerUrl: "https://example.com/inception_banner.jpg"
              durationMin: 148
              description: "A thief who steals corporate secrets through dream-sharing technology..."
              country: "USA"
              genreIds: [1, 2]
              altTitles:
                - title: "Начало"
                  language: "ru"
              languages: ["en", "ru"]
              cast:
                - personId: 1
                  character: "Dom Cobb"
                  sortOrder: 1
              staff:
                - personId: 2
                  role: "Director"
                - personId: 3
                  role: "Producer"
      responses:
        '201':
          description: Content created
          content:
